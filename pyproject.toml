[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-forecast-agent"
version = "1.0.0"
description = "Autonomous Multi-Agent Forecast Generation Swarm for Corporate FP&A on Google Cloud Platform"
authors = [{ name = "Sumeet Kumar", email = "krsumeet@google.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
