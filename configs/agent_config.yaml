# Autonomous Finance Swarm Configuration
app:
  name: "finance-forecast-agent"
  version: "1.0.0"
  environment: "prod"
  port: 8080

models:
  orchestrator:
    model_name: "gemini-2.5-pro"
    temperature: 0.1
    max_output_tokens: 4096
    thinking_budget: 1024
  sub_agents:
    model_name: "gemini-2.5-flash"
    temperature: 0.0
    max_output_tokens: 2048

forecasting:
  default_horizon_days: 90
  confidence_level: 0.95
  stale_data_threshold_hours: 48
  stale_confidence_penalty_multiplier: 1.5

risk_penalties:
  HIGH_RISK: 0.15      # 15% haircut (leadership departure + competitor launch)
  MEDIUM_RISK: 0.08    # 8% haircut (FX volatility / macro inflation)
  LOW_RISK: 0.02       # 2% operational variance (routine tracking)
  UPSIDE_ACCELERATION: -0.08 # +8% upside acceleration

telemetry:
  service_name: "finance-forecast-agent"
  latency_slo_ms: 60000 # 60 seconds P95
